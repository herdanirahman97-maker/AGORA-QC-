[theme]
base = "light"
primaryColor = "#1f2a7c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f8ff"
textColor = "#1122a6"

[client]
# "minimal" menyembunyikan Share, bintang, pensil (edit), ikon GitHub dan menu titik tiga dari pengunjung
toolbarMode = "minimal"
# sembunyikan detail error/traceback (yang bisa menampilkan potongan kode) dari pengunjung
showErrorDetails = "none"

[browser]
gatherUsageStats = false

